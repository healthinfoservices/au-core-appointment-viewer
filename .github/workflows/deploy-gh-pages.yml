name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the job can push to the gh-pages branch.
permissions:
  contents: write

# Don't let two deploys push to gh-pages at the same time.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run logic tests
        run: npm test

      - name: Build
        env:
          # Site is served from https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional default FHIR server. Set it under
          # Settings → Secrets and variables → Actions → Variables.
          # If unset, users enter the URL in the app's settings dialog.
          VITE_FHIR_BASE_URL: ${{ vars.VITE_FHIR_BASE_URL }}
        run: npm run build

      - name: Push dist/ to gh-pages branch
        run: |
          cd dist
          # Stop GitHub Pages running the output through Jekyll.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
